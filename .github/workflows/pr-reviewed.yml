name: PR reviewed

# Emits a `pr-reviewed` commit status asserting that somebody other than the
# author reviewed *this exact head commit*. The gate must assert a positive
# fact: "no unresolved threads" is satisfied vacuously by a pull request nobody
# reviewed, whereas a status that is never posted leaves the pull request
# blocked, which is the property the gate needs.
#
# There is deliberately no job to reset the status on a new push. Commit
# statuses are per-SHA, so a new head simply has no `pr-reviewed` status, and an
# absent required context blocks merge on its own.
#
# Two triggers, because one is not enough:
#
#   pull_request_review  fast path. Works when a *human* reviews. GitHub refuses
#                        to run workflows it attributes to the Copilot bot --
#                        such runs complete as `action_required` without ever
#                        executing -- so Copilot's own review cannot post this
#                        status, even though `copilot_code_review` re-reviews
#                        every push and Copilot is the only reviewer here.
#   schedule             backstop. Cron runs are attributed to github-actions,
#                        never to Copilot, so they always execute. This is what
#                        actually turns the status green on a Copilot-only
#                        review, within a cron tick of the review landing.
#
# Without the backstop this check could silently never post, which is
# indistinguishable from a mistyped context name and blocks merge forever.

on:
  pull_request_review:
    types: [submitted, dismissed]
  schedule:
    # Nominally every 5 minutes, but GitHub throttles scheduled runs hard on
    # this repo -- measured cadence is roughly hourly, and individual ticks are
    # dropped entirely. This is the unattended backstop, not the fast path.
    - cron: "*/5 * * * *"
  # The on-demand fast path. `gh workflow run "PR reviewed"` re-evaluates every
  # open pull request immediately, attributed to the dispatcher (a human), so
  # it always executes -- unlike a Copilot-triggered run, and unlike the
  # per-run Approve button, whose REST endpoint 403s on non-fork runs and so
  # cannot be scripted. This is how you unstick a pull request that is reviewed
  # but still waiting on the hourly cron.
  workflow_dispatch:

permissions:
  pull-requests: read
  statuses: write

jobs:
  report-status:
    runs-on: ubuntu-latest

    steps:
      - name: Report pr-reviewed status for each open pull request head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          # On a review event, only that pull request changed. On cron, sweep
          # every open pull request -- the review that needs reporting may have
          # landed on any of them.
          if [ -n "${EVENT_PR:-}" ]; then
            prs="$EVENT_PR"
          else
            prs=$(gh api --paginate "repos/$REPO/pulls?state=open" --jq '.[].number')
          fi

          for pr in $prs; do
            meta=$(gh api "repos/$REPO/pulls/$pr" --jq '"\(.head.sha) \(.user.login)"')
            HEAD_SHA="${meta%% *}"
            PR_AUTHOR="${meta##* }"
            export HEAD_SHA PR_AUTHOR

            # A gh or jq failure aborts before the POST, leaving the status
            # absent and the pull request blocked. Failing closed is the point.
            states=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews" \
              --jq '.[]
                    | select(.commit_id == env.HEAD_SHA)
                    | select(.user.login != env.PR_AUTHOR)
                    | select(.state != "DISMISSED")
                    | .state')

            if [ -z "$states" ]; then
              state=failure
              description="No review by another party on this commit."
            elif printf '%s\n' "$states" | grep -qx CHANGES_REQUESTED; then
              # Stays red while any changes-requested review stands on this head.
              # Clearing it is a human dismissing the review, which GitHub audits;
              # the gate never dismisses a review to satisfy itself.
              state=failure
              description="Changes requested on this commit."
            else
              state=success
              description="Reviewed on this commit."
            fi

            # Cron re-evaluates every open pull request on every tick. Posting an
            # unchanged status each time would bury the head in hundreds of
            # identical statuses a day.
            current=$(gh api "repos/$REPO/commits/$HEAD_SHA/status" \
              --jq '[.statuses[] | select(.context == "pr-reviewed")][0].state // ""')
            if [ "$current" = "$state" ]; then
              echo "pr#$pr head=$HEAD_SHA already $state, skipping"
              continue
            fi

            echo "pr#$pr head=$HEAD_SHA $current -> $state"
            gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
              -f state="$state" \
              -f context=pr-reviewed \
              -f description="$description" >/dev/null
          done
